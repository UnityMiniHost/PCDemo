<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Unity 小游戏宿主</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f7f7f7; }
    header {
      position: relative;
      height: 160px;
      background-image: url('../assets/home_title_background.png');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 18px;
      overflow: hidden;
      margin: 10px 10px 0;
    }
    .banner {
      position: absolute;
      left: 20px;
      bottom: 16px;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .list { padding:12px; }
    .card { display:flex; align-items:center; background:#fff; border-radius:12px; padding:10px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .icon { width:56px; height:56px; border-radius:12px; background:#eee; margin-right:12px; object-fit:cover; }
    .info { flex: 1 1 auto; min-width: 0; }
    .open-btn { flex-shrink: 0; }
    .brief { font-size:12px; color:#666; display:block; box-sizing:border-box; margin-right:16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tags { display:flex; gap:6px; margin:4px 0 6px; flex-wrap:wrap; }
    .tag { font-size:12px; color:#555; background:#f1f3f5; border-radius:12px; padding:2px 8px; line-height:18px; }
    .open-btn { background:#e6f0ff; color:#4a90e2; border:none; padding:8px 14px; border-radius:16px; cursor:pointer; }
    .toolbar { display:flex; gap:8px; padding:8px 12px; background:#fff; position:sticky; top:0; border-bottom:1px solid #eee; }
    input, button { font-size:14px; }
  </style>
</head>
<body>
 <header>
    <div class="banner">Unity 小游戏宿主</div>
  </header>
  <div class="list" id="gameList"></div>

  <script>
    const { ipcRenderer } = require('electron');

    // 规范化提取标签，兼容多种字段和格式
    function normalizeTags(tags) {
      let raw = [];
      for (const c of tags) {
        if (Array.isArray(c)) { raw = c; break; }
        if (typeof c === 'string' && c.trim()) {
          raw = c.split(/[,\s\/、|]+/).filter(Boolean);
          break;
        }
      }
      // 去重并最多展示 3 个
      const seen = new Set();
      const result = [];
      for (const t of raw) {
        const key = String(t).trim();
        if (!key) continue;
        if (!seen.has(key)) {
          seen.add(key);
          result.push(key);
        }
        if (result.length >= 3) break;
      }
      return result;
    }

    async function loadList() {
      let list = [];
      try {
        const res = await ipcRenderer.invoke('minihost:getGameList', { });
        console.log('[Renderer] minihost:getGameList response:', res);
        list = (res && res.list) || [];
      } catch (error) {
        console.error('[Renderer] invoke minihost:getGameList failed:', error);
        alert('IPC 调用失败：' + (error && error.message ? error.message : String(error)));
      }

      const container = document.getElementById('gameList');
      container.innerHTML = '';
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';

        const img = document.createElement('img');
        img.className = 'icon';
        img.src = item.iconUrl || '';
        img.alt = item.name || item.id || 'icon';

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = item.name || item.id || 'Unknown';

        // 新增：标签容器
        const tagsBox = document.createElement('div');
        tagsBox.className = 'tags';
        const tags = normalizeTags(item.tags || []);
        tags.forEach(tagText => {
          const tagEl = document.createElement('span');
          tagEl.className = 'tag';
          tagEl.textContent = tagText;
          tagsBox.appendChild(tagEl);
        });

        const brief = document.createElement('div');
        brief.className = 'brief';
        brief.textContent = item.briefIntro || '';

        info.appendChild(name);
        // 插入标签在名称与简介之间
        info.appendChild(tagsBox);
        info.appendChild(brief);

        const btn = document.createElement('button');
        btn.className = 'open-btn';
        btn.textContent = '打开';
        btn.onclick = async () => {
          const r = await ipcRenderer.invoke('minihost:launchGame', {
            gameId: item.id,
            launchKey: item.launchKey || item.id
          });
          if (!r || !r.ok) {
            alert('启动失败: ' + (r && r.msg || 'unknown'));
          }
        };

        div.appendChild(img);
        div.appendChild(info);
        div.appendChild(btn);
        container.appendChild(div);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadList();
    });
  </script>
</body>
</html>
